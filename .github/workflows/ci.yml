name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf dbus-x11 gnome-keyring
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust fixture suite
        run: cargo test --locked
      - name: Isolated Linux Secret Service fixtures
        if: runner.os == 'Linux'
        run: python -B scripts/linux_keyring_fixture.py
      - name: Hermetic diagnostics
        run: cargo run --locked -p switcher-diagnostics -- --fixtures
      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Frontend types
        working-directory: apps/desktop
        run: npm run check
      - name: Frontend fixtures
        working-directory: apps/desktop
        run: npm test
      - name: Frontend bundle
        working-directory: apps/desktop
        run: npm run build
      - name: Native desktop compilation and navigation fixture
        run: cargo test --locked -p primerswitch-desktop
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Packaging gate fixtures
        run: python -B scripts/test_package_preview.py
      - name: Repository boundary and documentation links
        run: python scripts/check_repository.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: PrimerSwitch-Linux-native-storage-evidence
          path: .artifacts/linux-native-storage-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
