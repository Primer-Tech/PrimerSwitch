name: Build preview packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Fixture tests
        run: cargo test --locked
      - name: Preview installer
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: PrimerSwitch-${{ runner.os }}-unsigned-preview
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
