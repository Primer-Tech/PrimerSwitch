[workspace]
resolver = "2"
members = ["crates/switcher-core", "crates/switcher-platform", "crates/provider-claude", "crates/switcher-runtime", "crates/switcher-diagnostics", "apps/desktop/src-tauri"]
default-members = ["crates/switcher-core", "crates/switcher-platform", "crates/provider-claude", "crates/switcher-runtime", "crates/switcher-diagnostics"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/Primer-Tech/PrimerSwitch"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
fs2 = "0.4"
async-trait = "0.1"
tauri = "2"
tauri-build = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
