[package]
name = "switcher-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
fs2.workspace = true
tempfile.workspace = true
chacha20poly1305 = "0.10.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Wdk_System_Threading", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
libc = "0.2"
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api", "async-io"] }
